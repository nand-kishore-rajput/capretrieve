[project]
name = "capretrieve"
version = "0.1.0"
description = "Capability-aware retrieval routing"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "llama-index-readers-obsidian>=0.7.0",
    "chromadb>=1.0",
    "tavily-python>=0.7.0",
    "httpx>=0.27",
    "langgraph>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx2>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--timeout=30"