connector_id: web_search
paradigm: keyword
freshness: live
privacy_tier: public_external
query_leaks_externally: true
scope: >
  Live web search via an external search API (Tavily/Brave/SerpAPI).
  Keyword-based, always current, but the raw query text leaves the local
  environment. Drives S1 (privacy hard-block): any query with personal or
  confidential content must be excluded from this connector regardless of
  how well it matches semantically.
